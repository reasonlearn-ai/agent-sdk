services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - --host
      - mongodb:27017
      - --quiet
      - --eval
      - >-
        try { rs.status() } catch (error) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
        }

volumes:
  mongodb_data:
